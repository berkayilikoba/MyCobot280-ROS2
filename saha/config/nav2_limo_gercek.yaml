amcl:
  ros__parameters: {use_sim_time: false, robot_model_type: 'nav2_amcl::DifferentialMotionModel',
    base_frame_id: base_link, odom_frame_id: odom, global_frame_id: map, scan_topic: scan_sabit,
    laser_max_range: 10.0, laser_min_range: 0.22, laser_model_type: likelihood_field,
    max_beams: 240, laser_likelihood_max_dist: 1.0, min_particles: 500, max_particles: 2000,
    pf_err: 0.05, pf_z: 0.99, resample_interval: 1, update_min_a: 0.05, update_min_d: 0.05,
    alpha1: 0.05, alpha2: 0.05, alpha3: 0.1, alpha4: 0.1, alpha5: 0.2, sigma_hit: 0.08,
    z_hit: 0.95, z_max: 0.05, z_rand: 0.02, z_short: 0.05, lambda_short: 0.1, do_beamskip: false,
    beam_skip_distance: 0.5, beam_skip_error_threshold: 0.9, beam_skip_threshold: 0.3,
    recovery_alpha_fast: 0.0, recovery_alpha_slow: 0.0, save_pose_rate: 0.5, tf_broadcast: true,
    transform_tolerance: 1.0}
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom_duz
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: ''
    default_nav_through_poses_bt_xml: ''
    plugin_lib_names: [nav2_compute_path_to_pose_action_bt_node, nav2_compute_path_through_poses_action_bt_node,
      nav2_smooth_path_action_bt_node, nav2_follow_path_action_bt_node, nav2_spin_action_bt_node,
      nav2_wait_action_bt_node, nav2_assisted_teleop_action_bt_node, nav2_back_up_action_bt_node,
      nav2_drive_on_heading_bt_node, nav2_clear_costmap_service_bt_node, nav2_is_stuck_condition_bt_node,
      nav2_goal_reached_condition_bt_node, nav2_goal_updated_condition_bt_node, nav2_globally_updated_goal_condition_bt_node,
      nav2_is_path_valid_condition_bt_node, nav2_initial_pose_received_condition_bt_node,
      nav2_reinitialize_global_localization_service_bt_node, nav2_rate_controller_bt_node,
      nav2_distance_controller_bt_node, nav2_speed_controller_bt_node, nav2_truncate_path_action_bt_node,
      nav2_truncate_path_local_action_bt_node, nav2_goal_updater_node_bt_node, nav2_recovery_node_bt_node,
      nav2_pipeline_sequence_bt_node, nav2_round_robin_node_bt_node, nav2_transform_available_condition_bt_node,
      nav2_time_expired_condition_bt_node, nav2_path_expiring_timer_condition, nav2_distance_traveled_condition_bt_node,
      nav2_single_trigger_bt_node, nav2_goal_updated_controller_bt_node, nav2_is_battery_low_condition_bt_node,
      nav2_navigate_through_poses_action_bt_node, nav2_navigate_to_pose_action_bt_node,
      nav2_remove_passed_goals_action_bt_node, nav2_planner_selector_bt_node, nav2_controller_selector_bt_node,
      nav2_goal_checker_selector_bt_node, nav2_controller_cancel_bt_node, nav2_path_longer_on_approach_bt_node,
      nav2_wait_cancel_bt_node, nav2_spin_cancel_bt_node, nav2_back_up_cancel_bt_node,
      nav2_assisted_teleop_cancel_bt_node, nav2_drive_on_heading_cancel_bt_node, nav2_is_battery_charging_condition_bt_node]
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker: {plugin: 'nav2_controller::SimpleProgressChecker', required_movement_radius: 0.15,
      movement_time_allowance: 20.0}
    general_goal_checker: {stateful: true, plugin: 'nav2_controller::SimpleGoalChecker',
      xy_goal_tolerance: 0.2, yaw_goal_tolerance: 0.35}
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 30
      model_dt: 0.1
      batch_size: 2000
      vx_std: 0.15
      wz_std: 0.3
      vx_max: 0.35
      vx_min: 0.0
      wz_max: 0.8
      iteration_count: 1
      prune_distance: 1.0
      transform_tolerance: 0.5
      temperature: 0.5
      gamma: 0.015
      motion_model: DiffDrive
      visualize: false
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic,
        PathFollowCritic, PathAngleCritic, PreferForwardCritic, TwirlingCritic]
      ConstraintCritic: {enabled: true, cost_power: 1, cost_weight: 4.0}
      GoalCritic: {enabled: true, cost_power: 1, cost_weight: 8.0, threshold_to_consider: 1.4}
      GoalAngleCritic: {enabled: true, cost_power: 1, cost_weight: 3.0, threshold_to_consider: 0.5}
      PreferForwardCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 0.5}
      CostCritic: {enabled: true, cost_power: 1, cost_weight: 3.81, critical_cost: 300.0,
        consider_footprint: true, collision_cost: 1000000.0, near_goal_distance: 1.0}
      PathAlignCritic: {enabled: true, cost_power: 1, cost_weight: 14.0, max_path_occupancy_ratio: 0.05,
        trajectory_point_step: 3, threshold_to_consider: 0.5, offset_from_furthest: 10,
        use_path_orientations: false}
      PathFollowCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, offset_from_furthest: 5,
        threshold_to_consider: 1.4}
      PathAngleCritic: {enabled: true, cost_power: 1, cost_weight: 2.0, offset_from_furthest: 4,
        threshold_to_consider: 0.5, max_angle_to_furthest: 1.0, forward_preference: false}
      TwirlingCritic: {enabled: true, cost_power: 1, cost_weight: 10.0}
    odom_topic: odom_duz
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: '[[-0.161,-0.11],[-0.161,0.11],[0.161,0.11],[0.161,-0.11]]'
      footprint_padding: 0.03
      transform_tolerance: 0.5
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan: {topic: /scan_sabit, data_type: LaserScan, marking: true, clearing: true,
          max_obstacle_height: 2.0, obstacle_max_range: 1.5, obstacle_min_range: 0.0,
          raytrace_max_range: 3.5, raytrace_min_range: 0.0}
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', inflation_radius: 0.35,
        cost_scaling_factor: 4.0}
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: '[[-0.161,-0.11],[-0.161,0.11],[0.161,0.11],[0.161,-0.11]]'
      footprint_padding: 0.03
      transform_tolerance: 0.5
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer: {plugin: 'nav2_costmap_2d::StaticLayer', map_subscribe_transient_local: true}
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan: {topic: /scan_sabit, data_type: LaserScan, marking: true, clearing: true,
          max_obstacle_height: 2.0, obstacle_max_range: 1.5, obstacle_min_range: 0.0,
          raytrace_max_range: 3.5, raytrace_min_range: 0.0}
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', inflation_radius: 0.35,
        cost_scaling_factor: 4.0}
      always_send_full_costmap: true
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother: {max_iterations: 1000, w_smooth: 0.3, w_data: 0.2, tolerance: 1.0e-10}
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin: {plugin: nav2_behaviors/Spin}
    backup: {plugin: nav2_behaviors/BackUp}
    drive_on_heading: {plugin: nav2_behaviors/DriveOnHeading}
    wait: {plugin: nav2_behaviors/Wait}
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.3
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.5
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: [FootprintApproach]
    FootprintApproach: {type: polygon, action_type: approach, footprint_topic: /local_costmap/published_footprint,
      time_before_collision: 1.2, simulation_time_step: 0.1, min_points: 6, visualize: false,
      enabled: true}
    observation_sources: [scan]
    scan: {type: scan, topic: scan_sabit, min_height: 0.15, max_height: 2.0, enabled: true}
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.35, 0.0, 0.8]
    min_velocity: [0.0, 0.0, -0.8]
    max_accel: [0.3, 0.0, 1.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: odom_duz
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
map_server:
  ros__parameters: {use_sim_time: false, yaml_filename: ''}
map_saver:
  ros__parameters: {use_sim_time: false, save_map_timeout: 5.0, free_thresh_default: 0.25,
    occupied_thresh_default: 0.65, map_subscribe_transient_local: true}
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint: {plugin: 'nav2_waypoint_follower::WaitAtWaypoint', enabled: true,
      waypoint_pause_duration: 200}

