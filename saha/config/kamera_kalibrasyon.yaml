# LIMO + Orbbec Dabai DC1 (USB 2bc5:0657): kamera dış kalibrasyonu ve çerçeve zinciri.
# Kaynak: resmi AgileX URDF (robottaki limo_description/urdf/limo_four_diff.xacro, upstream limo_ros1 aynı):
#   base_footprint -> base_link        z = 0.15 m
#   base_link -> depth_camera_link     xyz = (0.084, 0, 0.03) m, rpy = (0, 0, 0)
# 09.10.2026 sahada gözle doğrulandı: kamera yerden ~0.18 m, yatay, lidar ile aynı yöne (ileri) bakıyor.
# Not: CAD değeri; derinlik sensörünün kasa merkezine göre yanal ofseti (mm–cm) ve olası küçük montaj eğimi
# ayrıca ölçülmedi. Derinlik görüntüsünde zemin düzlemi oturtularak yükseklik/eğim doğrulanabilir.

base_link_to_camera_link:          # bu halka 09.10 kayıtlarında YOK; işlerken statik olarak ekleyin
  parent: base_link
  child: camera_link               # Orbbec ROS 2 sürücüsünün kök çerçevesi
  translation_m: [0.084, 0.0, 0.03]
  rotation_rpy_rad: [0.0, 0.0, 0.0]

# Sürücünün yayınladığı (kayıtta /tf_static'te mevcut) zincir, 09.10 kaydından:
#   camera_link -> camera_depth_frame             (0, 0, 0)        birim dönüş
#   camera_depth_frame -> camera_color_frame      (0, -0.030, 0)   renk sensörü derinliğin 3 cm sağında
#   camera_color_frame -> camera_color_optical_frame   q = (-0.5, 0.5, -0.5, 0.5)  (x sağ, y aşağı, z ileri)
#   camera_depth_frame -> camera_depth_optical_frame   q = (-0.5, 0.5, -0.5, 0.5)
# Görüntüler: renk 640x480 (camera_color_optical_frame), derinlik 640x400 16UC1 mm (camera_depth_optical_frame);
# iç parametreler /camera/*/camera_info, derinlik->renk dönüşümü /camera/depth_to_color.

# Kayıt oynatırken eksik halkayı eklemek (Humble):
#   ros2 run tf2_ros static_transform_publisher --x 0.084 --y 0 --z 0.03 --frame-id base_link --child-frame-id camera_link
# Kare pozu (dünya -> kamera optik):  T_map_optical = T_map_base(t) · T_base_camlink · T_camlink_optical
