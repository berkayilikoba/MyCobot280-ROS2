# LIMO + Orbbec Dabai DC1 (USB 2bc5:0657): kamera dış kalibrasyonu ve çerçeve zinciri.

base_link_to_camera_link:          # Orbbec sürücüsü bu halkayı yayınlamaz
  parent: base_link
  child: camera_link               # Orbbec ROS 2 sürücüsünün kök çerçevesi (= derinlik sensörü)
  translation_m: [0.084, 0.0, 0.028]
  rotation_rpy_rad: [0.0075, -0.0248, 0.0]   # roll +0.43°, pitch -1.42° (hafif yukarı bakıyor), yaw 0
  kaynak:
    x, y: "resmi AgileX URDF (robottaki limo_description/urdf/limo_four_diff.xacro; upstream limo_ros1 aynı):
           base_link -> depth_camera_link (0.084, 0, 0.03), base_footprint -> base_link z = 0.15"
    z, roll, pitch: "derinlik görüntüsünde zemin düzlemi (saha/analiz/zemin_egimi.py), 09.10.2026 dikdörtgen tur
           kaydı, 38 kare, düzlem RMS 3 mm: optik merkez yerden 17.8 cm (IQR 17.7-17.9),
           pitch -1.42° (IQR -1.72..-1.14), roll +0.43° (IQR +0.33..+0.57). URDF 18.0 cm / 0° ile uyumlu."
    yaw: "ölçülmedi (zeminden çıkmaz); sahada gözle lidar ile aynı yöne baktığı doğrulandı.
          Derinlik dilimini lidar taramasıyla eşleyerek ölçülebilir."
  belirsizlik: "x, y: CAD değeri; derinlik sensörünün kasa merkezine göre yanal ofseti (mm-cm) ölçülmedi.
          roll/pitch: robot ilerlerken gövde salınımı ve derinlik hatası dahil ~±0.3°."

# Sürücünün yayınladığı zincir (kayıtta /tf_static'te mevcut), 09.10 kaydından:
#   camera_link -> camera_depth_frame             (0, 0, 0)        birim dönüş
#   camera_depth_frame -> camera_color_frame      (0, -0.030, 0)   renk sensörü derinliğin 3 cm sağında
#   camera_color_frame -> camera_color_optical_frame   q = (-0.5, 0.5, -0.5, 0.5)  (x sağ, y aşağı, z ileri)
#   camera_depth_frame -> camera_depth_optical_frame   q = (-0.5, 0.5, -0.5, 0.5)
# Görüntüler: renk 640x480 rgb8 (camera_color_optical_frame), derinlik 640x400 16UC1 mm (camera_depth_optical_frame,
# fx=fy=475.7, cx=322.8, cy=201.9); iç parametreler /camera/*/camera_info, derinlik->renk /camera/depth_to_color.

# 09.10 kayıtlarında base_link -> camera_link YOK. Oynatırken eklemek (Humble):
#   ros2 run tf2_ros static_transform_publisher --x 0.084 --y 0 --z 0.028 --roll 0.0075 --pitch -0.0248 --yaw 0 \
#     --frame-id base_link --child-frame-id camera_link
# Sonraki kayıtlarda saha/nav_baslat.sh ve harita_baslat.sh bunu yayınlıyor (kayıtta /tf_static).
# Kare pozu (dünya -> kamera optik):  T_map_optik(t) = T_map_base(t) · T_base_camlink · T_camlink_optik
